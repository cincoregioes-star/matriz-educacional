<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leads | MATRIZ Educacional</title>

<style>
* {margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body {background:#f4f7fb;color:#172033}

.topo {
  background: linear-gradient(135deg,#071c3f,#004aad);
  color:#fff;
  padding:22px 0;
}

.container {width:94%;max-width:1180px;margin:auto}

.logo {font-size:28px;font-weight:900}
.logo span {color:#ffcc00}

.secao {padding:36px 0}

.painel-topo {
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  margin-bottom:20px;
}

h1 {font-size:30px}

button,input {
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
}

button {
  background:#004aad;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.btn-som {
  background:#ffcc00;
  color:#071c3f;
}

.grid-leads {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.card {
  background:#fff;
  padding:20px;
  border-radius:18px;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
  border-left:6px solid #004aad;
}

.card.novo {
  border-left:6px solid #00c853;
}

.alerta {
  position:fixed;
  top:20px;
  right:20px;
  background:#ffcc00;
  padding:15px;
  border-radius:12px;
  font-weight:bold;
}

@media(max-width:800px){
  .grid-leads{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header class="topo">
  <div class="container">
    <div class="logo">MATRIZ <span>Educacional</span></div>
  </div>
</header>

<section class="secao">
<div class="container">

<div class="painel-topo">
  <div>
    <h1>Leads capturados</h1>
    <p id="status">Som desativado</p>
  </div>

  <div>
    <button class="btn-som" onclick="ativarSom()">Ativar som</button>
    <button onclick="carregarLeads(true)">Atualizar</button>
    <input id="busca" placeholder="Buscar..." oninput="filtrar()">
  </div>
</div>

<div id="contador"></div>
<div id="lista" class="grid-leads"></div>

</div>
</section>

<script>
const SUPABASE_URL = "https://cxxlsapgodwckrhkbwpo.supabase.co";
const SUPABASE_KEY = "sb_publishable_myoZQmhn0sAEgkvLkRGoFQ_u18JJjPm";

let leadsGlobal = [];
let ultimoTotal = 0;
let somAtivo = false;

// 🔊 SOM DE ARPA (CORRETO)
const audioArpa = new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");
audioArpa.volume = 1;

function ativarSom(){
  somAtivo = true;
  audioArpa.play().catch(()=>{});
  document.getElementById("status").innerText = "Som ativado";
}

// 🔊 FUNÇÃO PEDIDA (ARPA)
function tocarSom() {
  if(!somAtivo) return;

  audioArpa.currentTime = 0;
  audioArpa.play().catch(() => {});
}

function alerta(){
  const div = document.createElement("div");
  div.className = "alerta";
  div.innerText = "🚀 Novo lead!";
  document.body.appendChild(div);
  setTimeout(()=>div.remove(),4000);
}

async function carregarLeads(manual=false){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/leads_matriz?select=*&order=id.desc`,{
    headers:{
      apikey:SUPABASE_KEY,
      Authorization:`Bearer ${SUPABASE_KEY}`
    }
  });

  const dados = await res.json();
  leadsGlobal = dados;

  document.getElementById("contador").innerText = "Total: "+dados.length;

  if(dados.length > ultimoTotal && ultimoTotal !== 0){
    alerta();
    tocarSom();
  }

  if(manual) alerta();

  ultimoTotal = dados.length;

  render(dados);
}

function render(lista){
  const el = document.getElementById("lista");

  el.innerHTML = lista.map((l,i)=>`
    <div class="card ${i===0?'novo':''}">
      <h3>${l.nome||'Sem nome'}</h3>
      <p><b>Whats:</b> ${l.whatsapp}</p>
      <p><b>Nível:</b> ${l.nivel}</p>
      <p><b>Preparo:</b> ${l.preparo}%</p>
      <p><b>Área:</b> ${l.area_principal}</p>

      <a target="_blank" href="https://wa.me/55${String(l.whatsapp).replace(/\D/g,'')}">
        WhatsApp
      </a>
    </div>
  `).join("");
}

function filtrar(){
  const t = document.getElementById("busca").value.toLowerCase();

  const f = leadsGlobal.filter(l =>
    (l.nome||'').toLowerCase().includes(t) ||
    (l.whatsapp||'').includes(t)
  );

  render(f);
}

carregarLeads();
setInterval(()=>carregarLeads(),5000);
</script>

</body>
</html>
