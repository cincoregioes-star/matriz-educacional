<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leads | MATRIZ</title>

<link rel="stylesheet" href="style.css">

<style>
.alerta-novo {
  position: fixed;
  top: 20px;
  right: 20px;
  background: #ffcc00;
  color: #000;
  padding: 15px 20px;
  border-radius: 12px;
  font-weight: bold;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  z-index: 9999;
  animation: aparecer 0.4s ease;
}

@keyframes aparecer {
  from { transform: translateY(-20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.novo {
  border-left: 6px solid #00c853;
}

.info-leads {
  margin-bottom: 20px;
  font-weight: bold;
  color: #003b8e;
}

.erro-leads {
  background: #ffecec;
  border-left: 6px solid #e53935;
  color: #7a0000;
  padding: 16px;
  border-radius: 12px;
  margin-bottom: 18px;
  font-weight: 700;
}

.barra-leads {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
  margin: 16px 0 22px;
}

.campo-busca {
  max-width: 360px;
}
</style>
</head>

<body>

<header class="topo">
  <div class="container topo-conteudo">
    <div class="logo">MATRIZ <span>Educacional</span></div>
  </div>
</header>

<main>
  <section class="secao">
    <div class="container">

      <h2>Leads capturados</h2>

      <div class="barra-leads">
        <button class="btn btn-principal" onclick="carregarLeads()">Atualizar agora</button>
        <input class="campo-busca" type="text" id="buscaLead" placeholder="Buscar por nome, WhatsApp ou área" oninput="renderizarLeads()">
      </div>

      <p class="info-leads" id="contadorLeads">Carregando leads...</p>

      <div id="erroLeads"></div>
      <div id="listaLeads"></div>

    </div>
  </section>
</main>

<script>
const SUPABASE_URL = "https://cxxlsapgodwckrhkbwpo.supabase.co";
const SUPABASE_KEY = "sb_publishable_myoZQmhn0sAEgkvLkRGoFQ_u18JJjPm";

let ultimoTotal = 0;
let leadsAtuais = [];

function tocarSom() {
  const audio = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
  audio.play().catch(() => {});
}

function mostrarAlerta() {
  const alerta = document.createElement("div");
  alerta.className = "alerta-novo";
  alerta.innerText = "🚀 Novo lead chegou!";
  document.body.appendChild(alerta);
  setTimeout(() => alerta.remove(), 4000);
}

function limparWhatsApp(valor) {
  return String(valor || "").replace(/\D/g, "");
}

function escaparHTML(valor) {
  return String(valor ?? "").replace(/[&<>"']/g, (m) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[m]));
}

function renderizarLeads() {
  const container = document.getElementById("listaLeads");
  const contador = document.getElementById("contadorLeads");
  const busca = document.getElementById("buscaLead").value.toLowerCase().trim();

  const leadsFiltrados = leadsAtuais.filter(lead => {
    const texto = `${lead.nome || ""} ${lead.whatsapp || ""} ${lead.serie || ""} ${lead.meta || ""} ${lead.nivel || ""} ${lead.area_principal || ""} ${lead.areas || ""}`.toLowerCase();
    return texto.includes(busca);
  });

  contador.innerText = `Total de leads: ${leadsAtuais.length} | Exibindo: ${leadsFiltrados.length}`;

  if (!leadsFiltrados.length) {
    container.innerHTML = "<p>Nenhum lead encontrado.</p>";
    return;
  }

  container.innerHTML = leadsFiltrados.map((lead, index) => {
    const whats = limparWhatsApp(lead.whatsapp);
    const linkWhats = whats ? `https://wa.me/55${whats}` : "#";

    return `
      <div class="resultado-card ${index === 0 ? 'novo' : ''}">
        <h3>${escaparHTML(lead.nome || "Sem nome")}</h3>

        <p><strong>WhatsApp:</strong> ${escaparHTML(lead.whatsapp || "Não informado")}</p>
        <p><strong>Série/Ano:</strong> ${escaparHTML(lead.serie || "Não informado")}</p>
        <p><strong>Meta:</strong> ${escaparHTML(lead.meta || "Não informado")}</p>
        <p><strong>Nível:</strong> ${escaparHTML(lead.nivel || "Não informado")}</p>
        <p><strong>Preparo:</strong> ${escaparHTML(lead.preparo ?? 0)}%</p>
        <p><strong>Área principal:</strong> ${escaparHTML(lead.area_principal || "Não informado")}</p>
        <p><strong>Áreas com dificuldade:</strong> ${escaparHTML(lead.areas || "Revisão geral")}</p>
        <p><strong>Data:</strong> ${escaparHTML(lead.data || "")} ${escaparHTML(lead.hora || "")}</p>

        <a class="btn btn-whatsapp" target="_blank" href="${linkWhats}">
          Chamar no WhatsApp
        </a>
      </div>
    `;
  }).join("");
}

async function carregarLeads() {
  const container = document.getElementById("listaLeads");
  const contador = document.getElementById("contadorLeads");
  const erroBox = document.getElementById("erroLeads");

  erroBox.innerHTML = "";

  try {
    const resposta = await fetch(`${SUPABASE_URL}/rest/v1/leads_matriz?select=*&order=id.desc`, {
      method: "GET",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      }
    });

    if (!resposta.ok) {
      const erroTexto = await resposta.text();
      container.innerHTML = "";
      contador.innerText = "Erro ao buscar leads.";
      erroBox.innerHTML = `
        <div class="erro-leads">
          Erro ao carregar leads do Supabase.<br>
          Código: ${resposta.status}<br>
          Detalhe: ${escaparHTML(erroTexto)}
        </div>
      `;
      console.error("Erro Supabase:", resposta.status, erroTexto);
      return;
    }

    const leads = await resposta.json();

    if (leads.length > ultimoTotal && ultimoTotal !== 0) {
      mostrarAlerta();
      tocarSom();
    }

    ultimoTotal = leads.length;
    leadsAtuais = leads;
    renderizarLeads();

  } catch (erro) {
    container.innerHTML = "";
    contador.innerText = "Falha na conexão.";
    erroBox.innerHTML = `
      <div class="erro-leads">
        Erro de conexão com Supabase. Verifique internet, URL, chave pública e bloqueio do navegador.
      </div>
    `;
    console.error("Falha:", erro);
  }
}

carregarLeads();
setInterval(carregarLeads, 5000);
</script>

</body>
</html>
