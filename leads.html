<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leads | MATRIZ Educacional</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  background: #f4f7fb;
  color: #172033;
}

.topo {
  background: linear-gradient(135deg, #071c3f, #004aad);
  color: #fff;
  padding: 22px 0;
  box-shadow: 0 8px 24px rgba(0,0,0,0.18);
}

.container {
  width: 94%;
  max-width: 1180px;
  margin: 0 auto;
}

.logo {
  font-size: 28px;
  font-weight: 900;
}

.logo span {
  color: #ffcc00;
}

.secao {
  padding: 36px 0;
}

.painel-topo {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}

h1 {
  color: #071c3f;
  font-size: 32px;
}

.controles {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

button,
input {
  padding: 13px 15px;
  border-radius: 12px;
  border: 1px solid #cbd5e1;
  font-size: 15px;
}

button {
  background: #004aad;
  color: #fff;
  font-weight: 800;
  cursor: pointer;
}

button:hover {
  background: #00357d;
}

input {
  min-width: 260px;
}

.info-leads {
  background: #fff;
  padding: 18px;
  border-radius: 18px;
  margin-bottom: 22px;
  box-shadow: 0 8px 22px rgba(0,0,0,0.08);
  color: #004aad;
  font-weight: 900;
}

.grid-leads {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
}

.card-lead {
  background: #fff;
  border-radius: 22px;
  padding: 22px;
  box-shadow: 0 10px 28px rgba(0,0,0,0.09);
  border-left: 7px solid #004aad;
}

.card-lead.novo {
  border-left-color: #00c853;
  animation: piscar 1.2s ease-in-out 3;
}

@keyframes piscar {
  0% { box-shadow: 0 0 0 rgba(0,200,83,0); }
  50% { box-shadow: 0 0 24px rgba(0,200,83,0.45); }
  100% { box-shadow: 0 0 0 rgba(0,200,83,0); }
}

.card-lead h3 {
  color: #071c3f;
  font-size: 22px;
  margin-bottom: 12px;
}

.card-lead p {
  margin: 7px 0;
  color: #334155;
}

.card-lead strong {
  color: #071c3f;
}

.acoes-card {
  margin-top: 16px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.btn-whatsapp {
  display: inline-block;
  background: #25d366;
  color: #fff;
  text-decoration: none;
  padding: 12px 16px;
  border-radius: 12px;
  font-weight: 900;
}

.btn-email {
  display: inline-block;
  background: #ffcc00;
  color: #071c3f;
  text-decoration: none;
  padding: 12px 16px;
  border-radius: 12px;
  font-weight: 900;
}

.alerta-novo {
  position: fixed;
  top: 20px;
  right: 20px;
  background: #ffcc00;
  color: #071c3f;
  padding: 18px 24px;
  border-radius: 16px;
  font-weight: 900;
  box-shadow: 0 12px 32px rgba(0,0,0,0.25);
  z-index: 9999;
  animation: aparecer 0.35s ease;
}

@keyframes aparecer {
  from { transform: translateY(-20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.status-online {
  display: inline-block;
  background: #dcfce7;
  color: #166534;
  padding: 8px 13px;
  border-radius: 999px;
  font-weight: 900;
  font-size: 14px;
}

.erro {
  background: #fee2e2;
  color: #991b1b;
  padding: 18px;
  border-radius: 16px;
  font-weight: bold;
}

@media (max-width: 800px) {
  .grid-leads {
    grid-template-columns: 1fr;
  }

  input,
  button {
    width: 100%;
  }

  .painel-topo {
    align-items: stretch;
  }
}
</style>
</head>

<body>

<header class="topo">
  <div class="container">
    <div class="logo">MATRIZ <span>Educacional</span></div>
  </div>
</header>

<main>
  <section class="secao">
    <div class="container">

      <div class="painel-topo">
        <div>
          <h1>Leads capturados</h1>
          <span class="status-online">● Monitoramento ativo</span>
        </div>

        <div class="controles">
          <button onclick="carregarLeads(true)">Atualizar agora</button>
          <input type="text" id="busca" placeholder="Buscar por nome ou WhatsApp" oninput="filtrarLeads()">
        </div>
      </div>

      <div class="info-leads" id="contadorLeads">Carregando leads...</div>

      <div id="listaLeads" class="grid-leads"></div>

    </div>
  </section>
</main>

<script>
const SUPABASE_URL = "https://cxxlsapgodwckrhkbwpo.supabase.co";
const SUPABASE_KEY = "sb_publishable_myoZQmhn0sAEgkvLkRGoFQ_u18JJjPm";

let ultimoTotal = Number(localStorage.getItem("ultimoTotalLeadsMatriz") || 0);
let leadsGlobais = [];

function tocarSom() {
  const audio = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
  audio.volume = 1;
  audio.play().catch(() => {});
}

function mostrarAlerta(texto = "🚀 Novo lead chegou!") {
  const alerta = document.createElement("div");
  alerta.className = "alerta-novo";
  alerta.innerText = texto;
  document.body.appendChild(alerta);

  setTimeout(() => alerta.remove(), 5000);
}

function limparTexto(valor) {
  return String(valor || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function formatarWhatsApp(numero) {
  return String(numero || "").replace(/\D/g, "");
}

async function carregarLeads(manual = false) {
  const container = document.getElementById("listaLeads");
  const contador = document.getElementById("contadorLeads");

  try {
    const resposta = await fetch(`${SUPABASE_URL}/rest/v1/leads_matriz?select=*&order=id.desc`, {
      method: "GET",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      }
    });

    if (!resposta.ok) {
      const erroTexto = await resposta.text();
      contador.innerHTML = `<div class="erro">Erro ao carregar leads do Supabase.</div>`;
      console.error("Erro Supabase:", erroTexto);
      return;
    }

    const leads = await resposta.json();
    leadsGlobais = leads;

    contador.innerHTML = `Total de leads: ${leads.length} | Exibindo: ${leads.length}`;

    if (leads.length > ultimoTotal && ultimoTotal !== 0) {
      mostrarAlerta("🚀 Novo lead recebido!");
      tocarSom();
    }

    if (manual) {
      mostrarAlerta("✅ Lista atualizada!");
    }

    ultimoTotal = leads.length;
    localStorage.setItem("ultimoTotalLeadsMatriz", String(ultimoTotal));

    renderizarLeads(leads);

  } catch (erro) {
    contador.innerHTML = `<div class="erro">Erro de conexão com Supabase.</div>`;
    console.error("Falha:", erro);
  }
}

function renderizarLeads(leads) {
  const container = document.getElementById("listaLeads");
  const contador = document.getElementById("contadorLeads");

  contador.innerHTML = `Total de leads: ${leadsGlobais.length} | Exibindo: ${leads.length}`;

  if (!leads.length) {
    container.innerHTML = `<p>Nenhum lead encontrado.</p>`;
    return;
  }

  container.innerHTML = leads.map((lead, index) => {
    const whats = formatarWhatsApp(lead.whatsapp);
    const nome = lead.nome || "Sem nome";

    return `
      <div class="card-lead ${index === 0 ? 'novo' : ''}">
        <h3>${nome}</h3>

        <p><strong>WhatsApp:</strong> ${lead.whatsapp || "Não informado"}</p>
        <p><strong>Série/Ano:</strong> ${lead.serie || "Não informado"}</p>
        <p><strong>Meta:</strong> ${lead.meta || "Não informado"}</p>
        <p><strong>Nível:</strong> ${lead.nivel || "Não informado"}</p>
        <p><strong>Preparo:</strong> ${lead.preparo || 0}%</p>
        <p><strong>Área principal:</strong> ${lead.area_principal || "Não informado"}</p>
        <p><strong>Áreas com dificuldade:</strong> ${lead.areas || "Revisão geral"}</p>
        <p><strong>Data:</strong> ${lead.data || ""} ${lead.hora || ""}</p>

        <div class="acoes-card">
          <a class="btn-whatsapp" target="_blank" href="https://wa.me/55${whats}">
            Chamar no WhatsApp
          </a>

          <a class="btn-email" href="mailto:professorsrcarlos@gmail.com?subject=Lead MATRIZ - ${encodeURIComponent(nome)}">
            Enviar email
          </a>
        </div>
      </div>
    `;
  }).join("");
}

function filtrarLeads() {
  const termo = limparTexto(document.getElementById("busca").value);

  const filtrados = leadsGlobais.filter(lead => {
    const nome = limparTexto(lead.nome);
    const whats = limparTexto(lead.whatsapp);
    const meta = limparTexto(lead.meta);
    return nome.includes(termo) || whats.includes(termo) || meta.includes(termo);
  });

  renderizarLeads(filtrados);
}

carregarLeads();
setInterval(() => carregarLeads(false), 5000);
</script>

</body>
</html>
